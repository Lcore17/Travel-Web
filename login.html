<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Anime Atlas</title>
        <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <div class="main-card">
        <div class="card-left">
            <h2>Welcome Back!</h2>
            <p>Your adventure awaits</p>
        </div>

        <div class="card-right">
            <h1>Login</h1>
            <p>Sign in to your account</p>

            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="user@anime.com">
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password">
            </div>

            <div class="demo-credentials">
                <p><strong>Demo Email:</strong> user@anime.com</p>
                <p><strong>Demo Password:</strong> password123</p>
            </div>

            <div class="login-btn">
                <a href="packages.html">Login</a>
            </div>

            <div class="signin">
                Don't have an account? <a href="index.html">Sign up</a>
            </div>
        </div>
    </div>

</body>

</html>
